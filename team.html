<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - Better Visuals</title>
    <style>
        @font-face {
            font-family: 'CreatoDisplay';
            src: url('fonts/CreatoDisplay-ExtraBold.otf') format('opentype'),
                 url('fonts/CreatoDisplay-ExtraBold.ttf') format('truetype'),
                 url('fonts/CreatoDisplay-ExtraBold.woff2') format('woff2'),
                 url('fonts/CreatoDisplay-ExtraBold.woff') format('woff');
            font-weight: 800;
            font-style: normal;
        }
        
        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
            --card-bg: #e8e8e8;
            --accent: #ff3366;
        }
        
        [data-theme="dark"] {
            --bg: #000000;
            --text: #ffffff;
            --border: #ffffff;
            --card-bg: #1a1a1a;
            --accent: #ff6699;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 150%;
        }
        
        body {
            font-family: 'CreatoDisplay', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 3rem;
        }
        
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
            padding: 0;
        }
        
        .theme-toggle svg {
            width: 1rem;
            height: 1rem;
        }
        
        .theme-toggle:hover {
            opacity: 0.6;
        }
        
        nav {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 0;
            padding: 1.25rem 0;
            margin-bottom: 1.5rem;
        }
        
        nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.3s;
            width: 6rem;
            text-align: center;
        }
        
        nav a:hover {
            opacity: 0.6;
        }
        
        nav a.active {
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        @media (max-width: 600px) {
            html {
                font-size: 130%;
            }
            
            .container {
                padding: 0 1rem;
            }
            
            nav {
                gap: 0;
                padding: 1.5rem 0;
            }
            
            nav a {
                width: 5rem;
            }
            
            .theme-toggle {
                top: 0.75rem;
                right: 0.75rem;
                width: 1rem;
                height: 1rem;
            }
            
            .theme-toggle svg {
                width: 0.75rem;
                height: 0.75rem;
            }
            
            .team-card {
                flex-direction: column;
                padding: 1.25rem;
                gap: 1rem;
                align-items: center;
                text-align: center;
            }
            
            .avatar {
                width: 5rem;
                height: 5rem;
                min-width: 5rem;
            }
            
            .member-name {
                font-size: 1rem;
            }
            
            .skills {
                font-size: 0.75rem;
            }
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.25rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            display: inline-block;
        }
        
        .team-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding-bottom: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .team-card {
            display: flex;
            gap: 1.5rem;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 0;
            transition: background-color 0.3s;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.4s ease forwards;
        }
        
        .team-card:nth-child(1) { animation-delay: 0.05s; }
        .team-card:nth-child(2) { animation-delay: 0.1s; }
        .team-card:nth-child(3) { animation-delay: 0.15s; }
        .team-card:nth-child(4) { animation-delay: 0.2s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .avatar {
            width: 7rem;
            height: 7rem;
            min-width: 7rem;
            background: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.625rem;
            opacity: 0.5;
            overflow: hidden;
        }
        
        .member-info {
            flex: 1;
        }
        
        .member-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .skills {
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.6;
            opacity: 0.8;
        }
        
        .skills a {
            color: var(--text);
            text-decoration: none;
            transition: opacity 0.3s;
        }
        
        .skills a:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>

        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    
    <div class="container">
        <nav>
            <a href="contact.html">Contact</a>
            <a href="index.html">Work</a>
            <a href="team.html" class="active">Team</a>
        </nav>
        
        <div class="team-container">
            <div class="team-card">
                <div class="avatar">Photo</div>
                <div class="member-info">
                    <h3 class="member-name">Felix Riße</h3>
                    <p class="skills">
                        <a href="team/FelixRiße/work.html#showreel">Management</a>, <a href="team/FelixRiße/work.html#showreel">Direction</a>, <a href="team/FelixRiße/work.html#showreel">Camera</a>, <a href="team/FelixRiße/work.html#showreel">Editing</a>, <a href="team/FelixRiße/work.html#threed">3D</a>, <a href="team/FelixRiße/work.html#graphics">Graphics</a>
                    </p>
                </div>
            </div>

            <div class="team-card">
                <div class="avatar">Photo</div>
                <div class="member-info">
                    <h3 class="member-name">Max Mustermann1</h3>
                    <p class="skills">
                        <a href="team/MaxMustermann1/work.html#website">Development</a>, <a href="team/MaxMustermann1/work.html#website">Backend</a>
                    </p>
                </div>
            </div>

            <div class="team-card">
                <div class="avatar">Photo</div>
                <div class="member-info">
                    <h3 class="member-name">Max Mustermann2</h3>
                    <p class="skills">
                        <a href="team/MaxMustermann2/work.html#graphics">UI/UX</a>, <a href="team/MaxMustermann2/work.html#graphics">Branding</a>
                    </p>
                </div>
            </div>

            <div class="team-card">
                <div class="avatar">Photo</div>
                <div class="member-info">
                    <h3 class="member-name">Max Mustermann3</h3>
                    <p class="skills">
                        <a href="team/MaxMustermann3/work.html#showreel">Animation</a>, <a href="team/MaxMustermann3/work.html#showreel">Video</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
        
        function updateThemeIcon(theme) {
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        updateThemeIcon(savedTheme);
    </script>
</body>
</html>
